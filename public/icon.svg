<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Wi-Fi Wave -->
  <path d="M96 176 C190 86 322 86 416 176" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Middle Wi-Fi Wave -->
  <path d="M144 232 C210 166 302 166 368 232" fill="none" stroke="#A5B4FC" stroke-width="26" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Inner Wi-Fi Wave -->
  <path d="M192 288 C228 252 284 252 320 288" fill="none" stroke="#818CF8" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Central Transmitter Node -->
  <circle cx="256" cy="352" r="32" fill="url(#accentGrad)"/>
  
  <!-- Fast Transfer Speed Arrow Overlay -->
  <path d="M236 340 L260 300 L250 350 L276 350 L248 404 L254 362 Z" fill="#FBBF24" opacity="0.95"/>
</svg>
